<title>نماذج خدمات الموشن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@500;600&family=DM+Mono:wght@500&display=swap">
<style>
  /* Layout: tab row of sample types, the stage sized to each sample's own aspect ratio, a transport bar beneath. Single dark look by choice. */
  :root {
    --field: #07060F;
    --ink: #0E0D1A;
    --paper: #F2EDFF;
    --pink: #FF2E88;
    --sun: #FFC62B;
    --muted: #8C87A8;
    --line: #2A2740;
    --ui: 'IBM Plex Sans Arabic', Tahoma, sans-serif;
    --mono: 'DM Mono', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--field);
    color: var(--paper);
    font-family: var(--ui);
    margin: 0;
    padding-inline: 16px;
    padding-block: 14px;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 12px;
    overflow: hidden;
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tabs button {
    font: inherit; font-size: 14px; font-weight: 600; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); background: var(--sun); border-color: var(--sun); }
  .tabs button:hover { color: var(--paper); border-color: var(--muted); }
  .tabs button[aria-selected="true"]:hover { color: var(--ink); }
  .stage { min-height: 0; display: grid; place-items: center; }
  canvas {
    display: block; max-width: 100%; max-height: 100%; width: auto; height: auto;
    background: var(--ink); border-radius: 6px;
  }
  .bar { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--muted); width: min(100%, 900px); justify-self: center; }
  .bar button {
    font: inherit; font-weight: 600; color: var(--paper); background: transparent; border: 1px solid var(--muted);
    border-radius: 999px; padding: 5px 16px; cursor: pointer;
  }
  .bar button:hover { border-color: var(--paper); }
  button:focus-visible, #scrub:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
  #scrub { flex: 1; min-width: 0; accent-color: var(--pink); direction: rtl; }
  #tc { font-family: var(--mono); font-variant-numeric: tabular-nums; min-width: 12ch; text-align: left; }
  #meta { font-size: 13px; }
  body.capture { padding: 0; display: block; background: var(--ink); }
  body.capture .tabs, body.capture .bar { display: none; }
  body.capture canvas { max-width: none; max-height: none; border-radius: 0; }
</style>

<nav class="tabs" dir="rtl" role="tablist" aria-label="نوع النموذج">
  <button id="tab-intro" type="button" role="tab" data-mode="intro">إنترو يوتيوب</button>
  <button id="tab-logo" type="button" role="tab" data-mode="logo">ظهور شعار</button>
  <button id="tab-ad" type="button" role="tab" data-mode="ad">إعلان متجر</button>
  <button id="tab-cover" type="button" role="tab" data-mode="cover">غلاف الخدمة</button>
</nav>
<div class="stage"><canvas id="c" width="1920" height="1080" aria-label="نموذج موشن جرافيك"></canvas></div>
<div class="bar" dir="rtl">
  <button id="play" type="button">إيقاف</button>
  <input id="scrub" type="range" min="0" max="300" step="1" value="0" aria-label="التنقل في الخط الزمني">
  <span id="meta"></span>
  <span id="tc" dir="ltr">0.00s</span>
</div>

<script>
(() => {
'use strict';
const FPS = 60, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 1920, H = 1080;

const DISPLAY = "Lalezar, 'Noto Kufi Arabic', Tahoma, sans-serif";
const UI = "'IBM Plex Sans Arabic', Tahoma, sans-serif";
const MONO = "'DM Mono', ui-monospace, Menlo, monospace";
window.REEL_FONTS = [["400 100px Lalezar", 'حركة ٠١٢٣٤٥٦٧٨٩٪'], ["600 20px 'IBM Plex Sans Arabic'", 'حركة ٠١٢٣'], ["500 20px 'DM Mono'", '0123:']];
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩';
const ar = s => String(s).replace(/[0-9]/g, d => AR_DIGITS[d]);

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  outExpo: t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t),
  inExpo: t => t <= 0 ? 0 : Math.pow(2, 10 * t - 10),
  inOutExpo: t => t <= 0 ? 0 : t >= 1 ? 1 : t < .5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2,
  outBack: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (TAU / 3)) + 1,
  inOutCubic: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
};
function rng(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- drawing helpers ----------
function fill(c) { ctx.fillStyle = c; ctx.fillRect(-200, -200, W + 400, H + 400); }
function circle(x, y, r, c) { if (r <= 0) return; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ring(x, y, r, lw, c) { if (r <= 0 || lw <= 0) return; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
function clipped(path, draw) { ctx.save(); ctx.beginPath(); path(); ctx.clip(); draw(); ctx.restore(); }
function font(px, fam = DISPLAY, w = 400) { ctx.font = `${w} ${px}px ${fam}`; }
function text(str, x, y, align = 'right', dir = 'rtl') {
  ctx.direction = dir; ctx.textAlign = align; ctx.fillText(str, x, y);
  ctx.direction = 'ltr'; ctx.textAlign = 'left';
}
function measure(str) { ctx.direction = 'rtl'; const w = ctx.measureText(str).width; ctx.direction = 'ltr'; return w; }
function star(x, y, rOut, rIn, n, rot, c) {
  ctx.fillStyle = c; ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? rIn : rOut, a = rot + i / (n * 2) * TAU; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath(); ctx.fill();
}
// Arabic words are rendered whole into sprites and animated as vertical strips, so letters stay joined.
const sprites = new Map();
function sprite(str, px, color, fam = DISPLAY) {
  const key = str + px + color + fam;
  if (sprites.has(key)) return sprites.get(key);
  font(px, fam); ctx.direction = 'rtl'; ctx.textAlign = 'left';
  const m = ctx.measureText(str);
  const pad = Math.ceil(px * .08);
  const asc = Math.ceil(m.actualBoundingBoxAscent) + pad, desc = Math.ceil(m.actualBoundingBoxDescent) + pad;
  const w = Math.ceil(m.actualBoundingBoxLeft + m.actualBoundingBoxRight) + pad * 2;
  const c = document.createElement('canvas'); c.width = w; c.height = asc + desc;
  const g = c.getContext('2d');
  g.font = `400 ${px}px ${fam}`; g.direction = 'rtl'; g.textAlign = 'left'; g.fillStyle = color;
  g.fillText(str, pad + m.actualBoundingBoxLeft, asc);
  ctx.direction = 'ltr';
  const s = { c, w, h: asc + desc, asc };
  sprites.set(key, s); return s;
}
function strips(s, cx, y, n, fn) {
  const sw = s.w / n, x0 = cx - s.w / 2;
  for (let i = 0; i < n; i++) {
    const o = fn(n - 1 - i, n); if (!o || o.a <= 0) continue;
    ctx.globalAlpha = o.a;
    ctx.drawImage(s.c, i * sw, 0, sw + .6, s.h, x0 + i * sw + (o.dx || 0), y - s.asc + (o.dy || 0), sw + .6, s.h);
  }
  ctx.globalAlpha = 1;
}
// Rise a word up from behind its own baseline, right to left.
function riseWord(s, cx, y, t, start, n = 14, stagger = .022, dur = .6) {
  clipped(() => ctx.rect(0, y - s.asc, W, s.h), () => strips(s, cx, y, n, k => {
    const a = E.outExpo(P(t, start + k * stagger, start + k * stagger + dur));
    return { dy: (1 - a) * s.h, a: 1 };
  }));
}

const grain = Array.from({ length: 6 }, (_, k) => {
  const g = document.createElement('canvas'); g.width = g.height = 256;
  const gx = g.getContext('2d'); const id = gx.createImageData(256, 256); const r = rng(500 + k);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255 | 0; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); return g;
});
function finish(frame, grainAlpha = .07) {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.38)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = grainAlpha;
  ctx.fillStyle = ctx.createPattern(grain[frame % grain.length], 'repeat');
  ctx.save(); ctx.translate((frame * 37) % 256, (frame * 91) % 256); ctx.fillRect(-256, -256, W + 512, H + 512); ctx.restore();
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function shakeAt(t, hits) {
  let x = 0, y = 0, amp = 0;
  for (const [h, A] of hits) {
    const d = t - h; if (d < 0 || d > .6) continue;
    const a = A * Math.exp(-d * 11);
    x += a * Math.sin(d * 95 + h * 7); y += a * Math.cos(d * 81 + h * 3); amp += a;
  }
  return { x, y, amp };
}
function withShake(t, hits, draw) {
  const sh = shakeAt(t, hits);
  ctx.save();
  const sc = 1 + sh.amp * 2.4 / Math.min(W, H);
  ctx.translate(W / 2 + sh.x, H / 2 + sh.y); ctx.scale(sc, sc); ctx.translate(-W / 2, -H / 2);
  draw(); ctx.restore();
}

// =====================================================================
// 1 · YouTube channel intro — fictional gaming channel "ليفل أب" (5.5 s, 16:9)
// =====================================================================
const G = { bg: '#0D0B2B', bg2: '#22145A', cyan: '#28E0FF', pink: '#FF2E88', gold: '#FFC62B', paper: '#F4F1FF', purple: '#7B5CFF', purple2: '#5B3FE0', red: '#FF3040' };
const PAD = [
  '....XXXXXXXX....',
  '..XXXXXXXXXXXX..',
  '.XXXXXXXXXXXXXX.',
  'XXXX.XXXXXXXPXXX',
  'XX.....XXXXCXGXX',
  'XXXX.XXXXXXXYXXX',
  'XXXXXXXXXXXXXXXX',
  'XXXXXX....XXXXXX',
  '.XXXX......XXXX.',
  '..XX........XX..',
];
const PXS = 40, PAD_Y = 285;
const padPixels = (() => {
  const r = rng(77), out = [];
  const colors = { X: null, P: G.pink, C: G.cyan, G: G.gold, Y: G.paper };
  PAD.forEach((row, j) => [...row].forEach((ch, i) => {
    if (ch === '.') return;
    const a = r() * TAU, d = 900 + r() * 700;
    out.push({
      i, j, c: colors[ch] || (j < 5 ? G.purple : G.purple2),
      ox: Math.cos(a) * d, oy: Math.sin(a) * d, rot: (r() - .5) * 8,
      delay: 1.0 + (15 - i) * .022 + r() * .12,
    });
  }));
  return out;
})();
const coins = (() => { const r = rng(5); return Array.from({ length: 26 }, () => ({ vx: -200 - r() * 900, vy: -700 - r() * 700, s: .7 + r() * .6, p: r() * TAU })); })();
function synthFloor(t, horizon) {
  // retro sun
  const sa = E.outCubic(P(t, .9, 1.6));
  if (sa > 0) {
    const R = 330;
    ctx.save(); ctx.globalAlpha = sa;
    ctx.beginPath(); ctx.rect(0, 0, W, horizon); ctx.clip();
    const g = ctx.createLinearGradient(0, horizon - R, 0, horizon);
    g.addColorStop(0, G.gold); g.addColorStop(1, G.pink);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W / 2, horizon, R, 0, TAU); ctx.fill();
    ctx.fillStyle = G.bg2;
    for (let k = 0; k < 7; k++) { const y = horizon - 30 - k * 34, h = 12 - k * 1.5; if (h > 0) ctx.fillRect(W / 2 - R, y, R * 2, h); }
    ctx.restore();
  }
  // perspective grid floor
  ctx.fillStyle = G.bg; ctx.fillRect(0, horizon, W, H - horizon);
  ctx.save(); ctx.beginPath(); ctx.rect(0, horizon, W, H - horizon); ctx.clip();
  ctx.strokeStyle = 'rgba(255,46,136,.45)'; ctx.lineWidth = 2;
  for (let k = -14; k <= 14; k++) { ctx.beginPath(); ctx.moveTo(W / 2 + k * 30, horizon); ctx.lineTo(W / 2 + k * 300, H); ctx.stroke(); }
  for (let i = 0; i < 12; i++) {
    const z = ((i / 12 + t * .7) % 1), y = horizon + (H - horizon) * z * z;
    ctx.globalAlpha = z; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore(); ctx.globalAlpha = 1;
  ctx.fillStyle = G.pink; ctx.fillRect(0, horizon - 1, W, 3);
}
function glitchSprite(s, cx, y, gi, frame) {
  const n = 12, sh = s.h / n, x0 = cx - s.w / 2, r = rng(frame * 13 + 1);
  const off = [];
  for (let k = 0; k < n; k++) off.push(r() < .5 ? (r() - .5) * 140 * gi : 0);
  const pass = (img, dx, mode) => {
    ctx.globalCompositeOperation = mode;
    for (let k = 0; k < n; k++) ctx.drawImage(img.c, 0, k * sh, s.w, sh + .5, x0 + dx + off[k], y - s.asc + k * sh, s.w, sh + .5);
  };
  const split = 5 + gi * 26;
  pass(sprite('ليفل أب', 190, G.cyan), -split, 'screen');
  pass(sprite('ليفل أب', 190, G.pink), split, 'screen');
  pass(s, 0, 'source-over');
  ctx.globalCompositeOperation = 'source-over';
}
function intro(t, frame) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, G.bg2); g.addColorStop(1, G.bg);
  ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400);
  const horizon = 620, LVL = 3.35;
  synthFloor(t, horizon);
  // press start
  if (t < .78) {
    if (Math.floor(t * 7) % 3 !== 2 || t > .55) {
      const pr = t > .55 ? 1 + .15 * Math.sin(P(t, .55, .78) * Math.PI) : 1;
      ctx.save(); ctx.translate(W / 2, 330); ctx.scale(pr, pr);
      ctx.fillStyle = G.paper; font(84); text('اضغط للبدء', 0, 30, 'center');
      ctx.restore();
    }
  }
  // level-up rays behind the logo
  const lu = P(t, LVL, LVL + 1.2);
  if (lu > 0) {
    ctx.save(); ctx.translate(W / 2, PAD_Y); ctx.rotate(t * .8); ctx.globalAlpha = (1 - lu) * .35;
    ctx.fillStyle = G.gold;
    for (let i = 0; i < 18; i++) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 200 + E.outExpo(lu) * 900, i / 18 * TAU, i / 18 * TAU + TAU / 40); ctx.closePath(); ctx.fill(); }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  // pixel controller assembles right to left
  const bump = 1 + .08 * Math.sin(P(t, 1.95, 2.2) * Math.PI) + .1 * Math.sin(P(t, LVL, LVL + .3) * Math.PI);
  const float = t > 2.2 ? Math.sin((t - 2.2) * 3) * 6 : 0;
  ctx.save(); ctx.translate(W / 2, PAD_Y + float); ctx.scale(bump, bump);
  const gx0 = -8 * PXS, gy0 = -5 * PXS;
  for (const p of padPixels) {
    const a = E.outExpo(P(t, p.delay, p.delay + .55));
    if (a <= 0) continue;
    const tx = gx0 + p.i * PXS + PXS / 2, ty = gy0 + p.j * PXS + PXS / 2;
    const s = lerp(.2, 1, a) * (PXS - 4);
    ctx.save(); ctx.translate(tx + p.ox * (1 - a), ty + p.oy * (1 - a)); ctx.rotate(p.rot * (1 - a));
    ctx.fillStyle = p.c; ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(-s / 2, -s / 2, s, s * .28);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(-s / 2, s / 2 - s * .18, s, s * .18);
    ctx.restore();
  }
  ctx.restore();
  // channel name with glitch
  const nameA = E.outBack(P(t, 2.05, 2.35));
  if (nameA > 0) {
    const s = sprite('ليفل أب', 190, G.paper);
    const gi = (t > 2.05 ? Math.exp(-(t - 2.05) * 7) : 0) + (t > LVL ? Math.exp(-(t - LVL) * 9) * .6 : 0);
    ctx.save(); ctx.translate(W / 2, 745); ctx.scale(nameA, nameA); ctx.translate(-W / 2, -745);
    glitchSprite(s, W / 2, 745, gi, frame);
    ctx.restore();
  }
  // XP bar fills right to left
  const barA = E.outBack(P(t, 2.4, 2.7));
  if (barA > 0) {
    const bw = 760, bh = 36, by = 800, seg = 20, bx = W / 2 - bw / 2;
    const f = E.inOutCubic(P(t, 2.6, LVL));
    ctx.save(); ctx.translate(W / 2, by); ctx.scale(barA, barA); ctx.translate(-W / 2, -by);
    ctx.fillStyle = 'rgba(244,241,255,.12)'; ctx.fillRect(bx - 6, by - 6, bw + 12, bh + 12);
    const lit = Math.round(f * seg);
    for (let k = 0; k < seg; k++) {
      const x = bx + bw - (k + 1) * (bw / seg);
      ctx.fillStyle = k < lit ? (t > LVL && Math.floor(t * 12) % 2 ? G.paper : G.gold) : 'rgba(244,241,255,.14)';
      ctx.fillRect(x + 3, by, bw / seg - 6, bh);
    }
    ctx.fillStyle = G.cyan; font(30, MONO, 500); text('XP', bx + bw + 24, by + 29, 'left', 'ltr');
    ctx.fillStyle = G.paper; font(40); text(`مستوى ${ar(1 + Math.round(f * 98))}`, bx - 24, by + 32, 'right');
    ctx.restore();
  }
  // level up coins
  if (t > LVL) {
    const d = t - LVL;
    for (const c of coins) {
      const x = W / 2 - 380 + c.vx * d, y = 810 + c.vy * d + 1500 * d * d;
      if (y > H + 40) continue;
      ctx.save(); ctx.translate(x, y); ctx.scale(Math.cos(d * 10 + c.p) * c.s, c.s);
      circle(0, 0, 18, G.gold); ctx.fillStyle = '#C98A00'; ctx.fillRect(-4, -10, 8, 20);
      ctx.restore();
    }
    const pop = E.outBack(P(t, LVL, LVL + .3)) * (1 - E.inCubic(P(t, LVL + .9, LVL + 1.2)));
    if (pop > 0) {
      ctx.save(); ctx.translate(W / 2 + 480, 600); ctx.rotate(-.12); ctx.scale(pop, pop);
      ctx.fillStyle = G.gold; ctx.beginPath(); ctx.roundRect(-150, -56, 300, 100, 16); ctx.fill();
      ctx.fillStyle = G.bg; font(64); text('ارتقاء!', 0, 20, 'center');
      ctx.restore();
    }
  }
  // subscribe
  const sub = E.outBack(P(t, 3.9, 4.25));
  if (sub > 0) {
    ctx.save(); ctx.translate(W / 2, 945); ctx.scale(sub, sub);
    ctx.fillStyle = G.red; ctx.fillRect(-230, -50, 460, 100);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-230, 38, 460, 12);
    ctx.fillStyle = G.paper; font(54); text('اشترك وفعّل الجرس', 0, 18, 'center');
    ctx.restore();
  }
  const out = E.inCubic(P(t, 5.05, 5.5));
  if (out > 0) { ctx.globalAlpha = out; fill(G.bg); ctx.globalAlpha = 1; }
  // white flash on "press"
  const fl = 1 - E.outCubic(P(t, .76, 1.05));
  if (t > .76 && fl > 0) { ctx.globalAlpha = fl; fill('#fff'); ctx.globalAlpha = 1; }
}

// =====================================================================
// 2 · Logo reveal — fictional juice brand "برد" (5 s, 16:9)
// =====================================================================
const J = { peach: '#FFE1C7', peach2: '#FFD0A8', orange: '#FF7A1A', pink: '#FF3D6E', yellow: '#FFC62B', cream: '#FFF6EC', green: '#2FAE63', deep: '#6E1830' };
const jc = document.createElement('canvas');
const bubbles = (() => { const r = rng(21); return Array.from({ length: 40 }, () => ({ x: r(), s: 4 + r() * 12, v: .15 + r() * .35, p: r() })); })();
const bgBubbles = (() => { const r = rng(8); return Array.from({ length: 18 }, () => ({ x: r(), s: 30 + r() * 90, v: .03 + r() * .06, p: r() })); })();
const splash = (() => { const r = rng(64); return Array.from({ length: 34 }, () => ({ x: (r() - .5) * 760, vx: (r() - .5) * 700, vy: -600 - r() * 900, s: 8 + r() * 18, c: r() < .5 ? J.orange : J.pink })); })();
function citrus(x, y, r, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  circle(0, 0, r, J.orange); circle(0, 0, r * .86, J.cream); circle(0, 0, r * .8, J.yellow);
  ctx.fillStyle = '#FFE38A';
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r * .72, a + .07, a + TAU / 8 - .07); ctx.closePath(); ctx.fill();
  }
  circle(0, 0, r * .1, J.cream);
  ctx.restore();
}

const MODES = {

  logo: { w: 1920, h: 1080, dur: 5, draw: logo, hits: [[2.2, 10], [2.72, 7], [2.87, 7]], meta: '16:9 · ٥ ثوانٍ' },
  ad: { w: 1080, h: 1920, dur: 8, draw: ad, hits: [[.3, 26], [2.4, 10], [3.8, 8]], meta: '9:16 · ٨ ثوانٍ' },
  cover: { w: 1280, h: 720, dur: 0, draw: cover, hits: [], meta: 'صورة ١٢٨٠×٧٢٠' },

let mode = 'intro';
function setMode(m) {
  mode = MODES[m] ? m : 'intro';
  const M = MODES[mode];

}

const capMatch = /capture-(\w+)/.exec(location.hash);
setMode(capMatch ? capMatch[1] : location.hash.slice(1));
window.reelReady = Promise.all(window.REEL_FONTS.map(([f, s]) => document.fonts.load(f, s))).catch(() => {}).then(() => sprites.clear());

const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), meta = document.getElementById('meta');

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let playing = !reduce, t0 = performance.now(), cur = 0;
function syncUI() {
  const M = MODES[mode];

  meta.textContent = M.meta;
  scrub.max = Math.max(1, Math.round(M.dur * FPS)); scrub.disabled = !M.dur; playBtn.disabled = !M.dur;
}
function pick(m) {

}
tabs.forEach(b => b.addEventListener('click', () => pick(b.dataset.mode)));
function setPlaying(p) { playing = p; playBtn.textContent = p ? 'إيقاف' : 'تشغيل'; t0 = performance.now() - cur * 1000; }
playBtn.addEventListener('click', () => setPlaying(!playing));
scrub.addEventListener('input', () => { cur = scrub.value / FPS; t0 = performance.now() - cur * 1000; render(cur); tc.textContent = cur.toFixed(2) + 's'; });
function loop(now) {
  const M = MODES[mode];
  if (playing && M.dur) {
    cur = ((now - t0) / 1000) % (M.dur + .6);
    const tt = Math.min(cur, M.dur - 1 / FPS);

})();
